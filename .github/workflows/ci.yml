name: Lint & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm

    # Monorepo npm workspaces : un seul lockfile a la racine
    - name: Install deps (all workspaces)
      run: npm ci

    # generate copie aussi les enums Prisma dans shared/src/enums.ts
    - name: Generate prisma (DB)
      run: npm run generate -w backend

    - name: Check shared enums are in sync with Prisma schema
      run: git diff --exit-code -- shared/

    # Le backend et le front importent @transcendence/shared : il doit etre compile avant lint/tsc
    - name: Build shared
      run: npm run build:shared

    - name: Lint (backend)
      run: npm run lint -w backend

    - name: Build (backend)
      run: npm run build -w backend

    - name: Lint (frontend)
      run: npm run lint -w frontend

    - name: Build (frontend)
      run: npm run build -w frontend

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: create .env file
      run: cp .env.example .env

    - name: Build docker
      run: docker compose build

    - name: Start services and wait for healthy
      run: docker compose up -d --wait
      
    - name: Dump logs on failure
      if: failure()
      run: docker compose logs

