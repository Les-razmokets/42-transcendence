services:
  db:
    image: postgres:18.6-alpine3.24
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - .env
    ports:
      - 127.0.0.1:5432:5432
    restart: unless-stopped
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${PORT}/api/health "]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: unless-stopped
  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
  genere-certif:
    image: alpine:3.24
    command:
      ["sh", "-c", "apk add --no-cache openssl && openssl req -x509 -newkey rsa:2048 -keyout  /infra/nginx/certs/cert.key -out /infra/nginx/certs/cert.crt -days 365 -nodes -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'"]
    volumes:
      - ./infra/nginx/certs:/infra/nginx/certs
  nginx:
    image: nginx:stable-alpine3.24
    depends_on:
      genere-certif:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
          condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider -q https://127.0.0.1:443/ && wget --no-check-certificate --spider -q https://127.0.0.1:443/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./infra/nginx/certs:/infra/nginx/certs
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 127.0.0.1:443:443
    restart: unless-stopped
volumes:
  db_data: