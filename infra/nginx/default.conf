# WebSocket upgrade: Upgrade and Connection are hop-by-hop headers, nginx does not
# forward them by itself. This map sets Connection from the client's Upgrade header:
# "upgrade" when it asks for a WebSocket, "close" for a plain request (e.g. Socket.IO
# long-polling), instead of always claiming "upgrade".
# A map must be at http level: this file is included inside http {} by the image's
# nginx.conf, so it goes here, outside server {}.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server{
  listen 443 ssl;
  resolver 127.0.0.11 valid=10s;
  server_name localhost;
  ssl_certificate /infra/nginx/certs/cert.crt;
  ssl_certificate_key /infra/nginx/certs/cert.key;
  location / {
    set $frontend_upstream http://frontend:5173;
    proxy_pass $frontend_upstream;
    proxy_set_header Host localhost;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  # Socket.IO (backend gateway). Default path on both sides, so nothing to configure
  # in Nest or socket.io-client. Not under /api: the Nest global prefix does not apply
  # to gateways. Rules added to /api (rate limiting, logs...) do NOT apply here.
  # No proxy_read_timeout needed: Socket.IO sends a heartbeat every 25s (pingInterval),
  # under nginx's 60s default. Raise both together if pingInterval ever goes above 60s.
  # X-Forwarded-For is overwritten (not appended) so the client cannot forge it.
  location /socket.io/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/metrics {
    deny all;
    return 403;
  }
}
server{
  listen 80;
  return 301 https://$host$request_uri;
}
