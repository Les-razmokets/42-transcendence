server{
  listen 443 ssl;
  server_name localhost;
  ssl_certificate /infra/nginx/certs/cert.crt;
  ssl_certificate_key /infra/nginx/certs/cert.key;
  location / {
      proxy_pass http://frontend:5173;
      proxy_set_header Host localhost;
  }
    location /api {
      proxy_pass http://backend:3000;
  }
}
